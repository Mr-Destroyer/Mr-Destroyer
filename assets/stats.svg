<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="100%" role="img">
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      /* Base states are the RESTING state — fully visible. The hidden start
         state and the animation itself live in theme.REDUCED_MOTION, gated on
         `prefers-reduced-motion: no-preference`. Do not move `opacity: 0` or a
         non-zero dashoffset back into these rules: as a base state they render
         a permanently blank card anywhere animations do not run. */
      @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      /* Normalised draw-on. Pair with `pathLength="1"` on the element and the
         browser treats the path as exactly 1 unit long, so the dash values are
         1 regardless of real geometry — no need to measure the path and pass
         its length in as `--len`, which was undefined in four of five assets
         and silently made the rule a no-op there. `from` is explicit because
         the base dashoffset is 0, so an implicit start would animate 0 -> 0. */
      .draw { stroke-dasharray: 1; stroke-dashoffset: 0; }
      @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      
    @media (prefers-reduced-motion: no-preference) {
      .rise { opacity: 0; animation: riseIn .7s cubic-bezier(.2,.7,.3,1) forwards; }
      .draw { stroke-dashoffset: 1; animation: draw 1.6s ease-out forwards; }
      .blink { animation: blink 1.1s steps(1) infinite; }
    }
    </style>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5A0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5A0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00E5A0" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.6;1" dur="4.0s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-0.1;1.5" dur="4.0s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="880" height="150" fill="#0B0F10"/><text x="28" y="38" font-size="11" fill="#00E5A0" font-weight="400" letter-spacing="2">// METRICS</text><text x="28" y="62" font-size="17" fill="#E6EDF3" font-weight="600">Mohammad Zim</text><text x="28" y="82" font-size="11" fill="#8B949E" font-weight="400">all figures computed from the live GitHub API</text><rect x="28" y="96" width="824" height="2" fill="#1E2A2E"/><rect x="28" y="96" width="824" height="2" fill="url(#sweep)"/><text x="110.4" y="128" font-size="26" fill="#00E5A0" font-weight="700" text-anchor="middle" class="rise" style="animation-delay:0.15s">44</text><text x="110.4" y="145" font-size="9" fill="#8B949E" font-weight="400" text-anchor="middle" letter-spacing="1.5" class="rise" style="animation-delay:0.15s">REPOSITORIES</text><text x="275.20000000000005" y="128" font-size="26" fill="#00E5A0" font-weight="700" text-anchor="middle" class="rise" style="animation-delay:0.24s">78</text><text x="275.20000000000005" y="145" font-size="9" fill="#8B949E" font-weight="400" text-anchor="middle" letter-spacing="1.5" class="rise" style="animation-delay:0.24s">STARS EARNED</text><line x1="193" y1="112" x2="193" y2="140" stroke="#1E2A2E" stroke-width="1"/><text x="440.0" y="128" font-size="26" fill="#00E5A0" font-weight="700" text-anchor="middle" class="rise" style="animation-delay:0.33s">29</text><text x="440.0" y="145" font-size="9" fill="#8B949E" font-weight="400" text-anchor="middle" letter-spacing="1.5" class="rise" style="animation-delay:0.33s">FOLLOWERS</text><line x1="358" y1="112" x2="358" y2="140" stroke="#1E2A2E" stroke-width="1"/><text x="604.8000000000001" y="128" font-size="26" fill="#00E5A0" font-weight="700" text-anchor="middle" class="rise" style="animation-delay:0.42s">35</text><text x="604.8000000000001" y="145" font-size="9" fill="#8B949E" font-weight="400" text-anchor="middle" letter-spacing="1.5" class="rise" style="animation-delay:0.42s">ACTIVE DAYS</text><line x1="522" y1="112" x2="522" y2="140" stroke="#1E2A2E" stroke-width="1"/><text x="769.6" y="128" font-size="26" fill="#00E5A0" font-weight="700" text-anchor="middle" class="rise" style="animation-delay:0.51s">2</text><text x="769.6" y="145" font-size="9" fill="#8B949E" font-weight="400" text-anchor="middle" letter-spacing="1.5" class="rise" style="animation-delay:0.51s">CURRENT STREAK</text><line x1="687" y1="112" x2="687" y2="140" stroke="#1E2A2E" stroke-width="1"/></svg>
