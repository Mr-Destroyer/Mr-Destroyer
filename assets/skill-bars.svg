<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%" height="180">
  <rect width="800" height="180" fill="#0d1117"/>
  <defs>
    <style>
      @keyframes fillBar { from { stroke-dashoffset: 300; } to { stroke-dashoffset: var(--target); } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      .bar-bg { fill: none; stroke: #1a1a2e; stroke-width: 12; stroke-linecap: round; }
      .bar-fg { fill: none; stroke-width: 12; stroke-linecap: round; stroke-dasharray: 300; animation: fillBar 2s ease-out forwards; }
      .label { font-family: monospace; font-size: 11px; fill: #00ff41; }
      .label-name { font-family: monospace; font-size: 12px; fill: #cccccc; }
      .pct { font-family: monospace; font-size: 10px; fill: #00cc33; }
      .cat { font-family: monospace; font-size: 13px; fill: #0088ff; font-weight: bold; }
    </style>
  </defs>
  
  <text class="cat" x="10" y="20">// SKILL_MATRIX :: CORE_COMPETENCIES</text>
  
  <!-- Python -->
  <text class="label-name" x="10" y="45">python.exe</text>
  <line class="bar-bg" x1="160" y1="42" x2="460" y2="42"/>
  <line class="bar-fg" x1="160" y1="42" x2="460" y2="42" stroke="#00ff41" style="--target: 40;">
    <animate attributeName="stroke-dashoffset" from="300" to="40" dur="1.5s" fill="freeze"/>
  </line>
  <text class="label" x="470" y="45">███████████████████████░░░ 95%</text>
  
  <!-- JavaScript -->
  <text class="label-name" x="10" y="65">javascript.js</text>
  <line class="bar-bg" x1="160" y1="62" x2="460" y2="62"/>
  <line class="bar-fg" x1="160" y1="62" x2="460" y2="62" stroke="#00cc33" style="--target: 80;">
    <animate attributeName="stroke-dashoffset" from="300" to="80" dur="1.5s" fill="freeze"/>
  </line>
  <text class="label" x="470" y="65">████████████████░░░░░░░ 78%</text>
  
  <!-- Bash / Linux -->
  <text class="label-name" x="10" y="85">bash.sh</text>
  <line class="bar-bg" x1="160" y1="82" x2="460" y2="82"/>
  <line class="bar-fg" x1="160" y1="82" x2="460" y2="82" stroke="#00ff41" style="--target: 25;">
    <animate attributeName="stroke-dashoffset" from="300" to="25" dur="1.5s" fill="freeze"/>
  </line>
  <text class="label" x="470" y="85">██████████████████████░░ 92%</text>
  
  <!-- C -->
  <text class="label-name" x="10" y="105">c_lang.c</text>
  <line class="bar-bg" x1="160" y1="102" x2="460" y2="102"/>
  <line class="bar-fg" x1="160" y1="102" x2="460" y2="102" stroke="#0088ff" style="--target: 120;">
    <animate attributeName="stroke-dashoffset" from="300" to="120" dur="1.5s" fill="freeze"/>
  </line>
  <text class="label" x="470" y="105">██████████████░░░░░░░░░ 60%</text>
  
  <!-- Node.js -->
  <text class="label-name" x="10" y="125">node.exe</text>
  <line class="bar-bg" x1="160" y1="122" x2="460" y2="122"/>
  <line class="bar-fg" x1="160" y1="122" x2="460" y2="122" stroke="#00cc33" style="--target: 100;">
    <animate attributeName="stroke-dashoffset" from="300" to="100" dur="1.5s" fill="freeze"/>
  </line>
  <text class="label" x="470" y="125">█████████████████░░░░░░ 75%</text>
  
  <!-- HTML/CSS -->
  <text class="label-name" x="10" y="145">web_stack.ui</text>
  <line class="bar-bg" x1="160" y1="142" x2="460" y2="142"/>
  <line class="bar-fg" x1="160" y1="142" x2="460" y2="142" stroke="#00ff41" style="--target: 55;">
    <animate attributeName="stroke-dashoffset" from="300" to="55" dur="1.5s" fill="freeze"/>
  </line>
  <text class="label" x="470" y="145">████████████████████░░░░ 82%</text>
  
  <!-- Status indicator -->
  <circle cx="490" cy="12" r="4" fill="#00ff41">
    <animate attributeName="opacity" values="1;0.3;1" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  <text class="label" x="500" y="16" style="font-size:9px;">SYSTEM_ACTIVE</text>
  
  <!-- Loading bar at bottom -->
  <rect x="550" y="40" width="230" height="14" rx="2" fill="none" stroke="#1a1a2e" stroke-width="1"/>
  <rect x="552" y="42" width="0" height="10" rx="1" fill="#00ff41">
    <animate attributeName="width" from="0" to="226" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text class="label" x="555" y="50" style="font-size:8px; fill:#0088ff;">INITIALIZING...</text>
</svg>