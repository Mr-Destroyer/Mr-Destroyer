<?xml version="1.0" encoding="UTF-8"?>
<!--
  divider.svg — section rule.

  Replaces the eight repeated ASCII-art comment banners in the old README
  (~40 lines of block-drawing characters that carried no information). One
  asset, reused between sections.

  The rule draws itself on once via stroke-dashoffset, then a single tick slides
  slowly along it. Both are one-shot or very slow — nothing flashes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 26" width="100%" role="img" aria-label="">
  <defs>
    <style>
      /* Normalised draw-on: the path carries pathLength="1", so the dash
         values are 1 no matter how wide the rule is. Hardcoding 880 here would
         silently stop working the moment the viewBox width changed.

         The RESTING state is dashoffset 0 — the rule fully drawn. The hidden
         start state lives in the media query. Resting at offset 1 would hide the
         rule permanently anywhere the animation does not run. `from` is explicit
         because an implicit start would animate 0 -> 0. */
      .draw { stroke-dasharray: 1; stroke-dashoffset: 0; }
      @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: no-preference) {
        .draw { stroke-dashoffset: 1; animation: draw 1.6s ease-out forwards; }
      }
    </style>
    <linearGradient id="tick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5A0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5A0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00E5A0" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.3;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1.3" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="880" height="26" fill="#0B0F10"/>
  <line class="draw" pathLength="1" x1="0" y1="13" x2="880" y2="13" stroke="#1E2A2E" stroke-width="1"/>
  <rect x="0" y="12" width="880" height="2" fill="url(#tick)"/>
  <rect x="0" y="9" width="2" height="8" fill="#1E2A2E"/>
  <rect x="878" y="9" width="2" height="8" fill="#1E2A2E"/>
</svg>
